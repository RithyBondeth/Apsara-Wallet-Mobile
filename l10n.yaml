# Configuration for Flutter's gen-l10n localization tool.
# Regenerates lib/l10n/generated/app_localizations*.dart from the .arb
# files whenever `flutter pub get` / `flutter gen-l10n` runs.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
