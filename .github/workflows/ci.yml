name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    # macOS on purpose: the goldens in test/goldens are rendered on macOS and
    # Linux's text rasterisation differs by a fraction of a percent, which is
    # exactly the noise the pixel comparison rejects.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Formatting is enforced so PR diffs never carry rewrap noise.
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Compiles both native projects. `analyze` and `test` never touch
  # AndroidManifest.xml, Info.plist, Gradle or the plugin registrants, so a
  # broken manifest or a plugin that fails to link only showed up on a
  # developer machine. Runs in parallel with the test job. Debug / no-codesign
  # builds: fast, and no signing material needed on CI.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches the Gradle wrapper distribution and dependency jars — the cold
      # download was ~10 of the APK step's 11 minutes. Pushes to develop/main
      # write the cache; PR runs read it (a PR can't poison the shared cache).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug --dart-define=ENV=staging
      - run: flutter build ios --simulator --no-codesign --dart-define=ENV=staging
