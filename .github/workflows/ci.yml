name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    # macOS on purpose: the goldens in test/goldens are rendered on macOS and
    # Linux's text rasterisation differs by a fraction of a percent, which is
    # exactly the noise the pixel comparison rejects.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
